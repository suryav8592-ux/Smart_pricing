{% extends 'base.html' %}
{% load static %}

{% block title %}Customer Login | Smart Price Catalog{% endblock %}

{% block content %}
<div class="py-5" style="background: linear-gradient(135deg, #f8fafc 0%, #eef5ff 100%); min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="custom-card p-4 p-md-5 bg-white shadow-lg border-0" style="border-radius: 20px;">
                    <div class="text-center mb-4">
                        <div class="brand-icon-badge mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h3 class="fw-bolder text-dark mb-1">Customer Login</h3>
                        <p class="text-muted small">Sign in to search and compare store prices</p>
                    </div>

                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="username" class="form-label small fw-bold text-secondary">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" 
                                       name="username" 
                                       id="username" 
                                       class="form-control border-start-0 bg-light" 
                                       placeholder="Enter your username" 
                                       required 
                                       autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password" 
                                       name="password" 
                                       id="password" 
                                       class="form-control border-start-0 bg-light" 
                                       placeholder="Enter your password" 
                                       required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary-custom py-2 fw-bold">
                                Log In to Catalog
                            </button>
                        </div>

                        <div class="text-center">
                            <p class="text-muted small mb-0">
                                Don't have an account? 
                                <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none">
                                    Register here
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
