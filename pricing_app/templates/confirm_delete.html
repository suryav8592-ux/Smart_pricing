<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ delete_title }} | Dynamic Pricing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
{% include 'pricing_app/back_button.html' %}
<main class="container py-5">
    <section class="card border-danger mx-auto" style="max-width: 640px;">
        <div class="card-body p-4">
            <h1 class="h3 text-danger">{{ delete_title }}</h1>
            <p>Are you sure you want to delete <strong>{{ object_name }}</strong>?</p>
            <p class="text-secondary">{{ warning }}</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{{ cancel_url }}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </section>
</main>
</body>
</html>
